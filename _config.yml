# NRSTATLAB — GitHub Pages configuration
#
# Only files that carry YAML front matter are processed by Jekyll. Every page in
# statistics-major/, machine-learning/ and ugc-net-statistics/ is hand-authored
# HTML with no front matter, so Jekyll copies those through byte-for-byte and no
# Liquid is ever run over them. The only processed files are the Data Science
# notes, which have front matter added, and the hub pages at the root.

title: NRSTATLAB
description: >-
  Statistics, Data Science and Machine Learning study material — undergraduate
  major courses, UGC NET preparation, and self-study notes.

kramdown:
  input: GFM
  syntax_highlighter: rouge

liquid:
  error_mode: warn

# Lab source (.c, .py, .sql, .sh) is copied through as plain files, so a student
# can open or download any lab program straight from the site. Only build and
# repository plumbing is kept out.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - .github/

# Section pages link to each other with relative URLs only, so the whole site
# moves to a custom domain without a single edit.
