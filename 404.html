<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — NRSTATLAB</title>
<!-- Styles are inlined rather than linked: a 404 is served for URLs at any
     depth, so no relative path to the stylesheet would be correct from all of
     them. -->
<style>
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; margin: 0;
         background: #f5f7fb; color: #1f2937; line-height: 1.6; }
  .wrapper { max-width: 760px; margin: 0 auto; padding: 40px 22px 80px; }
  .banner { background: linear-gradient(135deg,#0f4c81 0%,#1e7fbf 100%); color: #fff;
            padding: 36px 26px; border-radius: 14px;
            box-shadow: 0 6px 20px rgba(15,76,129,.18); margin-bottom: 28px; }
  .banner h1 { margin: 0 0 6px; font-size: 2.1rem; letter-spacing: .1em; }
  .banner p { margin: 0; opacity: .95; }
  .box { background: #fff; border: 1px solid #e2e8f0; border-left: 5px solid #1e7fbf;
         border-radius: 10px; padding: 18px 22px; }
  .box p:first-child { margin-top: 0; }
  .box p:last-child { margin-bottom: 0; }
  a { color: #1e7fbf; }
  footer { text-align: center; margin-top: 40px; font-size: .85rem; color: #6b7280; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="banner">
    <h1>NRSTATLAB</h1>
    <p>That page is not here.</p>
  </div>
  <div class="box">
    <p>The address you followed does not match anything on this site. It may have
    been a link to one of the older separate repositories, whose pages now live
    under this one.</p>
    <p>Go back to the <a id="home" href="/">NRSTATLAB home page</a> and pick a section from there.</p>
  </div>
  <footer>NRSTATLAB</footer>
</div>
<script>
  // A 404 is served for a URL at any depth and the address bar keeps the URL
  // that was asked for, so no relative link home would be right from all of
  // them -- the same reason the styles above are inlined. The site root is
  // worked out here instead: "/<repo>/" while this is served from github.io,
  // and "/" once it is served from its own domain. The href in the markup is
  // already the custom-domain answer, so this only corrects the project-pages
  // case, and the link still works if it never runs.
  if (location.hostname.endsWith(".github.io")) {
    document.getElementById("home").href =
      "/" + location.pathname.split("/")[1] + "/";
  }
</script>

</body>
</html>
