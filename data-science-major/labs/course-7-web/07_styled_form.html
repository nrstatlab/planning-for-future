<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment 7 — A CSS-styled student registration form</title>
<link rel="stylesheet" href="07_styled_form.css">
</head>
<body>

<h1>Student registration</h1>

<form id="reg" action="/register" method="post" novalidate>

  <fieldset>
    <legend>Personal details</legend>

    <label for="name">Full name <span aria-hidden="true">*</span></label>
    <input type="text" id="name" name="name" required minlength="3" maxlength="50"
           placeholder="Asha Kumari" autocomplete="name"
           aria-describedby="name-error">
    <span id="name-error" class="error" role="alert"></span>

    <label for="email">Email <span aria-hidden="true">*</span></label>
    <input type="email" id="email" name="email" required
           placeholder="asha@nri.ac.in" autocomplete="email"
           aria-describedby="email-error">
    <span id="email-error" class="error" role="alert"></span>

    <label for="mobile">Mobile <span aria-hidden="true">*</span></label>
    <input type="tel" id="mobile" name="mobile" required
           pattern="[6-9][0-9]{9}" placeholder="9876543210"
           title="10-digit Indian mobile number" aria-describedby="mobile-error">
    <span id="mobile-error" class="error" role="alert"></span>

    <label for="dob">Date of birth</label>
    <input type="date" id="dob" name="dob" max="2010-12-31">

    <fieldset>
      <legend>Gender</legend>
      <input type="radio" id="gf" name="gender" value="F"><label for="gf">Female</label>
      <input type="radio" id="gm" name="gender" value="M"><label for="gm">Male</label>
      <input type="radio" id="go" name="gender" value="O"><label for="go">Other</label>
    </fieldset>
  </fieldset>

  <fieldset>
    <legend>Account</legend>

    <label for="password">Password <span aria-hidden="true">*</span></label>
    <input type="password" id="password" name="password" required
           placeholder="At least 8 characters" autocomplete="new-password"
           aria-describedby="password-error">
    <span id="password-error" class="error" role="alert"></span>

    <label for="confirm">Confirm password <span aria-hidden="true">*</span></label>
    <input type="password" id="confirm" name="confirm" required
           placeholder="Type it again" autocomplete="new-password"
           aria-describedby="confirm-error">
    <span id="confirm-error" class="error" role="alert"></span>
  </fieldset>

  <fieldset>
    <legend>Programme</legend>

    <label for="course">Course</label>
    <select id="course" name="course">
      <option value="">— select —</option>
      <option value="ds" selected>B.Sc. Data Science</option>
      <option value="st">B.Sc. Statistics</option>
    </select>

    <label for="about">About yourself</label>
    <textarea id="about" name="about" rows="4" maxlength="200"
              placeholder="A sentence or two"></textarea>
  </fieldset>

  <input type="checkbox" id="terms" name="terms" required
         aria-describedby="terms-error">
  <label for="terms">I accept the terms <span aria-hidden="true">*</span></label>
  <span id="terms-error" class="error" role="alert"></span>

  <p><button type="submit">Register</button>
     <button type="reset">Clear</button></p>

  <p id="status" role="status" aria-live="polite"></p>
</form>

</body>
</html>
