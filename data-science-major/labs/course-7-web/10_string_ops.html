<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment 10 — String operations</title>
<link rel="stylesheet" href="07_styled_form.css">
<style>
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #d6dbe4; padding: 8px 10px; text-align: left; }
  th { background: #eef2f7; width: 40%; }
  tbody tr:nth-child(even) { background: #fafbfd; }
  code { background: #eef2f7; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>

<h1>String operations</h1>

<form id="f" onsubmit="return false">
  <fieldset>
    <legend>Input</legend>
    <label for="text">Enter some text</label>
    <input type="text" id="text" name="text" value="Data Science"
           placeholder="Type anything">
  </fieldset>
  <table>
    <caption class="sr-only">Computed string statistics</caption>
    <tbody id="out"></tbody>
  </table>
</form>

<script type="module">
  import { stats } from "./10_string_ops.js";

  const input = document.getElementById("text");
  const out   = document.getElementById("out");

  const LABELS = {
    length: "Length", words: "Words", vowels: "Vowels",
    consonants: "Consonants", digits: "Digits",
    upper: "Uppercase", lower: "Lowercase", title: "Title Case",
    reversed: "Reversed", firstFour: "slice(0, 4)", lastSeven: "slice(-7)",
    isPalindrome: "Palindrome?", longestWord: "Longest word"
  };

  function render() {
    const s = stats(input.value);
    out.textContent = "";
    for (const [key, label] of Object.entries(LABELS)) {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      const td = document.createElement("td");
      th.scope = "row";
      th.textContent = label;
      td.textContent = String(s[key]);      // textContent, never innerHTML
      tr.append(th, td);
      out.append(tr);
    }
  }

  input.addEventListener("input", render);  // live, on every keystroke
  render();
</script>

</body>
</html>
