<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment 6 — Mailing list subscription form</title>
<link rel="stylesheet" href="07_styled_form.css">
</head>
<body>

<h1>Subscribe to the Data Science newsletter</h1>

<form id="subscribe" action="/subscribe" method="post" novalidate>

  <fieldset>
    <legend>Your details</legend>

    <label for="email">Email address <span aria-hidden="true">*</span></label>
    <input type="email" id="email" name="email" required
           autocomplete="email" aria-describedby="email-error"
           placeholder="asha@example.com">
    <span id="email-error" class="error" role="alert"></span>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" autocomplete="name"
           placeholder="Asha Kumari">

    <label for="org">College or organisation</label>
    <input type="text" id="org" name="org" autocomplete="organization">
  </fieldset>

  <fieldset>
    <legend>What would you like to hear about?</legend>
    <input type="checkbox" id="i1" name="topics" value="ds" checked>
    <label for="i1">Data Science</label>
    <input type="checkbox" id="i2" name="topics" value="ml">
    <label for="i2">Machine Learning</label>
    <input type="checkbox" id="i3" name="topics" value="viz">
    <label for="i3">Visualization</label>
    <input type="checkbox" id="i4" name="topics" value="jobs">
    <label for="i4">Jobs and internships</label>
  </fieldset>

  <fieldset>
    <legend>Preferences</legend>

    <label for="freq">How often?</label>
    <select id="freq" name="freq">
      <option value="d">Daily digest</option>
      <option value="w" selected>Weekly summary</option>
      <option value="m">Monthly round-up</option>
    </select>

    <fieldset>
      <legend>Format</legend>
      <input type="radio" id="fh" name="format" value="html" checked>
      <label for="fh">HTML</label>
      <input type="radio" id="ft" name="format" value="text">
      <label for="ft">Plain text</label>
    </fieldset>
  </fieldset>

  <input type="checkbox" id="consent" name="consent" required
         aria-describedby="consent-error">
  <label for="consent">I consent to receiving email at this address
    <span aria-hidden="true">*</span></label>
  <span id="consent-error" class="error" role="alert"></span>

  <p><button type="submit">Subscribe</button>
     <button type="reset">Clear</button></p>

  <p id="status" role="status" aria-live="polite"></p>
</form>

<p><small>The consent checkbox is <strong>unticked by default</strong> and is
  <code>required</code>. Pre-ticked consent is unlawful under most
  data-protection regimes, and an examiner who knows that is looking for
  it.</small></p>

<script type="module">
  import { validate } from "./11_validation.js";

  const form = document.getElementById("subscribe");

  form.addEventListener("submit", e => {
    e.preventDefault();                       // demo only: nothing to POST to
    const email = form.elements.email.value;
    const box = document.getElementById("email-error");
    const consentBox = document.getElementById("consent-error");

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim());
    box.textContent = emailOk ? "" : "Enter a valid email address";
    form.elements.email.classList.toggle("is-invalid", !emailOk);

    const consentOk = form.elements.consent.checked;
    consentBox.textContent = consentOk ? "" : "You must consent before subscribing";

    document.getElementById("status").textContent =
      emailOk && consentOk ? `Subscribed ${email.trim()}.` : "";
  });
</script>

</body>
</html>
