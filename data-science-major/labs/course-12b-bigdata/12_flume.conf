# Experiment 12 -- capture and store log/streaming data using Flume
#
# *** NOT EXECUTED ***
# This is the command sequence / program you submit on a real Hadoop cluster.
# Hadoop, Hive, Pig, Sqoop, Flume, HBase and ZooKeeper cannot be installed in
# the verification environment -- the Debian repositories that host them are
# blocked by the egress policy -- so this file has NEVER BEEN RUN here.
# Nothing in the notes claims an output for it.
#
# The runnable half is 12_flume_equivalent.py, which runs the source/channel/sink semantics
#
# run with:
#   flume-ng agent --conf $FLUME_HOME/conf --conf-file 12_flume.conf \
#                  --name a1 -Dflume.root.logger=INFO,console

a1.sources  = tailsrc
a1.channels = memch filech
a1.sinks    = hdfssink alertsink

# --- source -----------------------------------------------------------------
a1.sources.tailsrc.type              = TAILDIR
a1.sources.tailsrc.filegroups        = f1
a1.sources.tailsrc.filegroups.f1     = /var/log/apache2/access.log.*
a1.sources.tailsrc.positionFile      = /var/lib/flume/taildir_position.json
#   TAILDIR, not `exec tail -F`: exec sources lose everything on restart
#   because there is no position file. This is the single most common
#   Flume data-loss bug.

# --- interceptors: add HEADERS, never touch the body -----------------------
a1.sources.tailsrc.interceptors                 = ts host regex
a1.sources.tailsrc.interceptors.ts.type         = timestamp
a1.sources.tailsrc.interceptors.host.type       = host
a1.sources.tailsrc.interceptors.host.useIP      = true
a1.sources.tailsrc.interceptors.regex.type      = regex_extractor
a1.sources.tailsrc.interceptors.regex.regex     = ^\S+ \S+ \S+ \[[^\]]+\] "\S+ (\S+)[^"]*" (\d{3})
a1.sources.tailsrc.interceptors.regex.serializers            = s1 s2
a1.sources.tailsrc.interceptors.regex.serializers.s1.name    = path
a1.sources.tailsrc.interceptors.regex.serializers.s2.name    = status

# --- route on a header ------------------------------------------------------
a1.sources.tailsrc.selector.type           = multiplexing
a1.sources.tailsrc.selector.header         = status
a1.sources.tailsrc.selector.mapping.500    = filech
a1.sources.tailsrc.selector.default        = memch

# --- channels ---------------------------------------------------------------
a1.channels.memch.type                  = memory
a1.channels.memch.capacity              = 10000
a1.channels.memch.transactionCapacity   = 1000
#   capacity is EVENTS, not bytes. A full channel blocks the source --
#   back-pressure, which is correct behaviour and looks like a hang.

a1.channels.filech.type                 = file
a1.channels.filech.checkpointDir        = /var/lib/flume/checkpoint
a1.channels.filech.dataDirs             = /var/lib/flume/data
#   file channel: survives a crash, roughly 10x slower. "We must not lose
#   events" and `type = memory` cannot both be true.

# --- sinks ------------------------------------------------------------------
a1.sinks.hdfssink.type              = hdfs
a1.sinks.hdfssink.hdfs.path         = hdfs://nn:9000/logs/dt=%Y-%m-%d/hr=%H
a1.sinks.hdfssink.hdfs.filePrefix   = access
a1.sinks.hdfssink.hdfs.fileType     = DataStream
a1.sinks.hdfssink.hdfs.writeFormat  = Text
a1.sinks.hdfssink.hdfs.batchSize    = 1000
a1.sinks.hdfssink.hdfs.rollInterval = 600         # 10 min, not the 30 s default
a1.sinks.hdfssink.hdfs.rollSize     = 134217728   # one HDFS block
a1.sinks.hdfssink.hdfs.rollCount    = 0           # 0 = never roll on count
#   THE DEFAULTS (30 s / 1 KB / 10 events) MANUFACTURE THE SMALL-FILES
#   PROBLEM. Left alone they produce a file every few seconds, each a few
#   hundred bytes, and the NameNode pays for every one. Always override.

a1.sinks.alertsink.type             = logger

# --- wire it together -------------------------------------------------------
a1.sources.tailsrc.channels  = memch filech
a1.sinks.hdfssink.channel    = memch
a1.sinks.alertsink.channel   = filech
